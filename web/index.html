<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>EVO 16 Remote</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <span class="brand-mark">▮</span>
      <h1>EVO 16</h1>
      <span class="header-sub">Remote Control</span>
    </div>
    <span id="status-badge" class="badge live">● LIVE</span>
  </header>
  <div class="presets">
    <span class="presets-label">PERFIL DE PREAMPS</span>
    <select id="preset-select" class="preset-select">
      <option value="">— sin perfiles —</option>
    </select>
    <button id="preset-apply" class="pbtn">APLICAR</button>
    <button id="preset-save" class="pbtn accent">GUARDAR ESTADO</button>
    <button id="preset-export" class="pbtn">EXPORTAR</button>
    <button id="preset-import" class="pbtn">IMPORTAR</button>
    <button id="preset-delete" class="pbtn danger">BORRAR</button>
    <span id="preset-info" class="preset-info"></span>
  </div>
  <div class="mainvol">
    <span class="presets-label">MAIN OUT</span>
    <input id="main-volume" class="vol-range" type="range" min="0" max="100" step="1" value="0">
    <span id="main-volume-val" class="vol-val">0 / 100</span>
    <button id="store-standalone" class="pbtn">GUARDAR EN LA INTERFAZ</button>
    <span class="vol-hint">escala de la pantalla del equipo (0 = −96 dB, 100 = 0 dB) · se manda en vivo al deslizar · «GUARDAR EN LA INTERFAZ» copia TODO el estado a la memoria interna del equipo (una sola vía, para uso standalone)</span>
  </div>
  <div id="rack" class="rack"></div>
  <footer id="device-name" class="dim">—</footer>
</div>
<script src="app.js?v=8"></script>
</body>
</html>
